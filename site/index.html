        "proficiencyLevel": "Expert",
        "isPartOf": { "@id": "https://core.vanduo.dev/#website" },
        "about": [
          {
            "@type": "DefinedTerm",
            "name": "Golden Ratio (φ)",
            "description": "Irrational proportional constant φ = (1 + √5) / 2 ≈ 1.6180339887 governing harmonic scaling."

          {

      {

        "@id": "https://core.vanduo.dev/#axioms",

        "hasDefinedTerm": [
          {
            "@type": "DefinedTerm",
            "termCode": "Class A",
            "name": "Basis Class A — Mathematical Derivation",
            "description": "Values derived directly from φ, √φ, Fibonacci numbers Fn, Lucas numbers Ln, or Golden Angle 137.508°."
          },
          {
            "@type": "DefinedTerm",

            "name": "Basis Class B — Conventional by Design",

  <script>
    (function () {
      try {
        var root = document.documentElement;
        var s = window.localStorage;
        var theme = s.getItem('vanduo-theme-preference');
        if (theme === 'light' || theme === 'dark') {
          root.setAttribute('data-theme', theme);
        } else {
          root.removeAttribute('data-theme');
        }
        var palette = s.getItem('vanduo-palette');
        if (palette === 'open-color' || palette === 'fibonacci') root.setAttribute('data-palette', palette);
        var primary = s.getItem('vanduo-primary-color');
        if (primary) root.setAttribute('data-primary', primary);
        var neutral = s.getItem('vanduo-neutral-color');
        if (neutral) root.setAttribute('data-neutral', neutral);
        var radius = s.getItem('vanduo-radius');
        if (radius) {
          root.setAttribute('data-radius', radius);
          root.style.setProperty('--vd-radius-scale', radius);
        }
        var font = s.getItem('vanduo-font-preference');
        if (font) root.setAttribute('data-font', font);
        var motion = s.getItem('vanduo-motion');
        if (motion === 'full' || motion === 'reduce' || motion === 'off') {
          root.setAttribute('data-motion', motion);
        }
      } catch (_e) {}
    })();
  </script>
